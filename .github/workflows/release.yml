name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LIBEWF_VERSION: "20240506"
  LIBEWF_SHA256: "247d8ee9572392a2404be514d1137f099970f41f240c1134ddc3f04322281c67"
  BZIP2_REF: "3bdf198c9ffd3469afe62045bef33c3c6b5105b4"
  VSTOOLS_REF: "a19882bf6f46c4eaeb2b323eeef3cfe94956fde6"

jobs:
  build-linux:
    name: Build Linux Binaries
    runs-on: ${{ matrix.variant.name == 'cuda' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: cpu
            features: ""
            suffix: "cpu-only"
          - name: opencl
            features: "--features gpu-opencl"
            suffix: "opencl"
          - name: cuda
            features: "--features gpu-cuda"
            suffix: "cuda"
    
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libewf-dev

      - name: Install OpenCL dependencies
        if: matrix.variant.name == 'opencl'
        run: |
          sudo apt-get install -y ocl-icd-opencl-dev opencl-headers

      - name: Install CUDA dependencies
        if: matrix.variant.name == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart"]'

      - name: Set CUDA environment
        if: matrix.variant.name == 'cuda'
        run: |
          echo "CUDA_PATH=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $GITHUB_ENV
          echo "CUDA_ROOT=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $GITHUB_ENV
          echo "CUDA_HOME=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $GITHUB_ENV
          echo "CUDA_TOOLKIT_ROOT_DIR=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}" >> $GITHUB_ENV
          echo "CUDACXX=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin/nvcc" >> $GITHUB_ENV
          echo "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${{ steps.cuda-toolkit.outputs.CUDA_PATH }}/lib64:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Verify CUDA install
        if: matrix.variant.name == 'cuda'
        run: |
          which nvcc
          nvcc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release ${{ matrix.variant.features }}

      - name: Strip binary
        run: strip target/release/swiftbeaver

      - name: Package artifact
        run: |
          mkdir -p dist
          cp target/release/swiftbeaver dist/swiftbeaver
          tar -czf dist/swiftbeaver-linux-x86_64-${{ matrix.variant.suffix }}.tar.gz -C dist swiftbeaver
          rm dist/swiftbeaver

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftbeaver-linux-${{ matrix.variant.suffix }}
          path: dist/swiftbeaver-linux-x86_64-${{ matrix.variant.suffix }}.tar.gz

  build-windows:
    name: Build Windows Binaries (${{ matrix.variant.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: cpu-only
            build_args: "--no-default-features"
            suffix: "cpu-only"
            ewf: false
          - name: ewf
            build_args: ""
            suffix: "ewf"
            ewf: true

    steps:
      - uses: actions/checkout@v4

      - name: Restore libewf cache
        if: matrix.variant.ewf
        id: cache-libewf
        uses: actions/cache@v4
        with:
          path: deps/libewf/dist
          key: ${{ runner.os }}-libewf-${{ env.LIBEWF_VERSION }}-${{ env.BZIP2_REF }}-${{ env.VSTOOLS_REF }}-${{ hashFiles('scripts/build-libewf-windows.ps1') }}-x64-v1

      - name: Set up Python
        if: matrix.variant.ewf && steps.cache-libewf.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build libewf
        if: matrix.variant.ewf && steps.cache-libewf.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\scripts\build-libewf-windows.ps1

      - name: Configure libewf environment
        if: matrix.variant.ewf
        shell: pwsh
        run: |
          $libewfRoot = "${{ github.workspace }}\deps\libewf\dist"
          "LIBEWF_LIB_DIR=$libewfRoot\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$libewfRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release ${{ matrix.variant.build_args }}

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, package | Out-Null
          Copy-Item target/release/swiftbeaver.exe package/swiftbeaver.exe
          if ("${{ matrix.variant.ewf }}" -eq "true") {
            Copy-Item deps/libewf/dist/bin/*.dll package/ -Force
            Copy-Item deps/libewf/dist/licenses package/third_party_licenses -Recurse -Force
          }
          Compress-Archive -Path package/* -DestinationPath dist/swiftbeaver-windows-x86_64-${{ matrix.variant.suffix }}.zip -Force

      - name: Verify packaged executable
        shell: pwsh
        run: |
          .\package\swiftbeaver.exe --version
          if ("${{ matrix.variant.ewf }}" -eq "true") {
            $out = Join-Path $env:RUNNER_TEMP "swiftbeaver-ewf-smoke"
            Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
            .\package\swiftbeaver.exe --input tests\golden_image\golden.E01 --output $out --max-chunks 1 --metadata-only
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftbeaver-windows-${{ matrix.variant.suffix }}
          path: dist/swiftbeaver-windows-x86_64-${{ matrix.variant.suffix }}.zip

  create-release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find artifacts -name "*.zip" -exec cp {} release/ \;
          ls -lh release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
          body: |
            ## SwiftBeaver Release ${{ github.ref_name }}
            
            ### Available Builds
            
            - **swiftbeaver-linux-x86_64-cpu-only.tar.gz** - CPU-only build, no GPU support
              - Works on any Linux system
              - No GPU dependencies required
              - Best for compatibility
            
            - **swiftbeaver-linux-x86_64-opencl.tar.gz** - OpenCL GPU support
              - Supports NVIDIA, AMD, and Intel GPUs
              - Requires OpenCL runtime (install `ocl-icd-opencl-dev`)
              - Use with `--gpu` flag
            
            - **swiftbeaver-linux-x86_64-cuda.tar.gz** - CUDA GPU support
              - NVIDIA GPUs only
              - Requires CUDA runtime (version 12.x)
              - Best performance on NVIDIA hardware
              - Use with `--gpu` flag

            - **swiftbeaver-windows-x86_64-cpu-only.zip** - Windows CPU-only build
              - No GPU support
              - E01/libewf support is not included
              - Best for native Windows compatibility

            - **swiftbeaver-windows-x86_64-ewf.zip** - Windows build with E01/libewf support
              - No GPU support
              - Bundles libewf runtime DLLs
              - Use this build for E01/E02 evidence on Windows

            ### Installation
            
            ```bash
            # Download and extract (choose your variant)
            tar -xzf swiftbeaver-linux-x86_64-<variant>.tar.gz
            
            # Move to PATH
            sudo mv swiftbeaver /usr/local/bin/
            
            # Verify installation
            swiftbeaver --version
            ```

            On Windows, extract the selected `.zip` and run `swiftbeaver.exe` from PowerShell or Command Prompt. Use `swiftbeaver-windows-x86_64-ewf.zip` for E01/E02 inputs.

            ### Verify Checksums
            
            ```bash
            sha256sum -c SHA256SUMS
            ```
            
            See [documentation](https://github.com/${{ github.repository }}/tree/main/docs) for full usage instructions.

  build-latest:
    name: Build Latest Binaries (Main Branch)
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p latest
          find artifacts -name "*.tar.gz" -exec cp {} latest/ \;
          find artifacts -name "*.zip" -exec cp {} latest/ \;
          ls -lh latest/

      - name: Generate checksums
        run: |
          cd latest
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (main branch)
          prerelease: true
          files: |
            latest/*.tar.gz
            latest/*.zip
            latest/SHA256SUMS
          body: |
            ## Latest Development Build
            
            **⚠️ Development builds from main branch - may be unstable**
            
            Auto-generated from latest commit on main branch.
            
            Commit: ${{ github.sha }}
            
            ### Available Builds
            
            - **swiftbeaver-linux-x86_64-cpu-only.tar.gz** - CPU-only
            - **swiftbeaver-linux-x86_64-opencl.tar.gz** - OpenCL GPU
            - **swiftbeaver-linux-x86_64-cuda.tar.gz** - CUDA GPU
            - **swiftbeaver-windows-x86_64-cpu-only.zip** - Windows CPU-only
            - **swiftbeaver-windows-x86_64-ewf.zip** - Windows with E01/libewf
            
            See release notes for variant details and installation instructions.
