name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  LIBEWF_VERSION: "20240506"
  LIBEWF_SHA256: "c1b522def0ef061e0780efbd3aa89b6a3babe7b9d51ead3897a60cdf7da4227d"
  BZIP2_REF: "3bdf198c9ffd3469afe62045bef33c3c6b5105b4"
  VSTOOLS_REF: "a19882bf6f46c4eaeb2b323eeef3cfe94956fde6"

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libewf-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run tests (with EWF)
        run: cargo test --verbose

      - name: Run tests (without EWF)
        run: cargo test --no-default-features --verbose

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libewf-dev ocl-icd-opencl-dev opencl-headers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run clippy (without default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Run clippy (OpenCL feature)
        run: cargo clippy --all-targets --features gpu-opencl -- -D warnings

  build:
    name: Build Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            build_args: "--verbose"
            artifact_name: swiftbeaver-linux-x86_64
            artifact_path: target/release/swiftbeaver
          - name: windows-x86_64-cpu-only
            os: windows-latest
            build_args: "--no-default-features --verbose"
            artifact_name: swiftbeaver-windows-x86_64-cpu-only
            artifact_path: target/release/swiftbeaver.exe
            ewf: false
          - name: windows-x86_64-ewf
            os: windows-latest
            build_args: "--verbose"
            artifact_name: swiftbeaver-windows-x86_64-ewf
            artifact_path: target/release/swiftbeaver.exe
            ewf: true
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libewf-dev

      - name: Restore libewf cache
        if: matrix.ewf
        id: cache-libewf
        uses: actions/cache@v4
        with:
          path: deps/libewf/dist
          key: ${{ runner.os }}-libewf-${{ env.LIBEWF_VERSION }}-${{ env.BZIP2_REF }}-${{ env.VSTOOLS_REF }}-${{ hashFiles('scripts/build-libewf-windows.ps1') }}-x64-v1

      - name: Set up Python
        if: matrix.ewf && steps.cache-libewf.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build libewf
        if: matrix.ewf && steps.cache-libewf.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\scripts\build-libewf-windows.ps1

      - name: Configure libewf environment
        if: matrix.ewf
        shell: pwsh
        run: |
          $libewfRoot = "${{ github.workspace }}\deps\libewf\dist"
          "LIBEWF_LIB_DIR=$libewfRoot\lib" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$libewfRoot\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build release binary
        run: cargo build --release ${{ matrix.build_args }}

      - name: Verify Windows EWF executable starts
        if: matrix.ewf
        shell: pwsh
        run: .\target\release\swiftbeaver.exe --version

      - name: Smoke test Windows EWF input
        if: matrix.ewf
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "swiftbeaver-ewf-smoke"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          .\target\release\swiftbeaver.exe --input tests\golden_image\golden.E01 --output $out --max-chunks 1 --metadata-only

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  # GPU build verification - only OpenCL (CUDA requires special setup in release.yml)
  gpu-build:
    name: GPU Feature Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libewf-dev ocl-icd-opencl-dev opencl-headers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Check OpenCL feature compiles
        run: cargo check --features gpu-opencl --verbose

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libewf-dev ocl-icd-opencl-dev opencl-headers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build documentation (default features only, no CUDA)
        run: cargo doc --no-deps --document-private-items --features gpu-opencl
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libewf-dev llvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Run coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info
