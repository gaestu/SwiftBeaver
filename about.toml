# cargo-about configuration for generating third-party license reports.
#
# This inventory is for reporting only. The accepted list allows cargo-about to
# satisfy license expressions seen in the resolved dependency graph; it is not a
# project policy gate.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

# Include target-specific dependencies for the platform families SwiftBeaver may
# build or package for, rather than depending on the host running the generator.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# Include build, dev, optional, and transitive dependencies unless explicitly
# changed by the generator command.
ignore-build-dependencies = false
ignore-dev-dependencies = false
ignore-transitive-dependencies = false
